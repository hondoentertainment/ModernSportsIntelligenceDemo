# Supabase CLI config — migrations live in supabase/migrations/
# Run: supabase link (once) then supabase db push / supabase functions deploy

project_id = "msi"

[api]
enabled = true

[auth]
enabled = true
site_url = "https://modern-sports-intelligence-demo.vercel.app"
additional_redirect_urls = [
  "https://modern-sports-intelligence-demo.vercel.app/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "https://*-hondo4185-5820s-projects.vercel.app/**",
]

# Keep hosted-project defaults (config push merges these; do not loosen prod).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[functions.create-checkout-session]
verify_jwt = true

[functions.create-billing-portal-session]
verify_jwt = true

[functions.admin-audit-events]
verify_jwt = true
