<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSI | Modern Sports Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=Fira+Code&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            charcoal: 'oklch(0.15 0.01 240)',
                            lime: 'oklch(0.88 0.20 127)',
                            orange: 'oklch(0.75 0.18 45)',
                            slate: 'oklch(0.20 0.01 240)',
                            teal: 'oklch(0.75 0.15 180)',
                            muted: 'oklch(0.35 0.01 240)',
                            red: 'oklch(0.60 0.24 25)',
                            green: 'oklch(0.70 0.15 140)'
                        }
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --brand-charcoal: oklch(0.15 0.01 240);
            --brand-lime: oklch(0.88 0.20 127);
            --brand-orange: oklch(0.75 0.18 45);
            --brand-slate: oklch(0.20 0.01 240);
            --brand-teal: oklch(0.75 0.15 180);
            scroll-behavior: smooth;
        }

        html,
        body {
            height: 100%;
            scrollbar-gutter: stable;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--brand-charcoal);
            color: #ffffff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1,
        h2,
        .font-bebas {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: -0.5px;
        }

        .font-mono {
            font-family: 'Fira Code', monospace;
        }

        /* Generic scrollbar for all scrollable containers */
        * {
            scrollbar-width: thin;
            scrollbar-color: oklch(0.88 0.20 127 / 0.1) transparent;
        }

        /* Webkit specific scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: oklch(0.88 0.20 127 / 0.1);
            border-radius: 20px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: oklch(0.88 0.20 127 / 0.3);
            background-clip: content-box;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: oklch(0.88 0.20 127 / 0.2);
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .page-container {
                padding-bottom: 80px;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Section Reveal Animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal-section {
            animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(400%);
            }
        }

        .animate-scan {
            animation: scan 3s linear infinite;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
