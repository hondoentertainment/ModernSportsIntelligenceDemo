name: Supabase types drift

# Regenerates types/supabase.gen.ts from the live Supabase schema and fails if
# it differs from what is committed — catching schema drift that would make
# SupabaseClient<Database> typings lie.
#
# Activation: add repository secrets SUPABASE_ACCESS_TOKEN (from
# https://supabase.com/dashboard/account/tokens) and SUPABASE_PROJECT_ID
# (project ref). Without them the job no-ops cleanly. See docs/SUPABASE_TYPES.md.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'types/supabase.gen.ts'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'types/supabase.gen.ts'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types-drift:
    name: Generated types match schema
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase credentials
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID not set — skipping types drift check."
            echo "See docs/SUPABASE_TYPES.md to enable."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Regenerate Supabase types
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase gen types typescript \
            --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" \
            > types/supabase.gen.ts

      - name: Fail on drift
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if ! git diff --exit-code -- types/supabase.gen.ts; then
            echo "::error::types/supabase.gen.ts is out of date with the Supabase schema."
            echo "Run 'npm run types:supabase' locally and commit the result."
            exit 1
          fi
          echo "types/supabase.gen.ts matches the live schema."
