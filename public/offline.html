<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d9f99d">
    <title>Offline | Modern Sports Intelligence</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #141418;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .card {
            max-width: 22rem;
            padding: 2rem 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(217, 249, 157, 0.2);
            background: rgba(30, 30, 36, 0.9);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            margin-bottom: 1.25rem;
            border-radius: 0.75rem;
            background: rgba(217, 249, 157, 0.12);
            color: #d9f99d;
            font-size: 1.5rem;
        }
        h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
        p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
        .actions { display: flex; flex-direction: column; gap: 0.65rem; }
        a.primary, button.primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.25rem;
            background: #d9f99d;
            color: #141418;
            border: none;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
        }
        a.primary:hover, button.primary:hover { opacity: 0.92; }
        a.secondary {
            font-size: 0.8rem;
            color: #d9f99d;
            text-decoration: none;
            font-weight: 600;
        }
        a.secondary:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card" role="alert">
        <div class="badge" aria-hidden="true">◇</div>
        <h1>You're offline</h1>
        <p>Reconnect to sync portfolio data, live prices, and AI tools. If the app shell is cached, try the dashboard hash route. This page only appears when that shell is missing.</p>
        <div class="actions">
            <button type="button" class="primary" onclick="window.location.reload()">Try again</button>
            <a class="secondary" href="/#/">Open cached dashboard</a>
        </div>
    </div>
</body>
</html>
