# Modern Sports Intelligence - Local development with Supabase
# Usage: docker-compose up -d
# App: http://localhost:3000 (Vite dev) or use preview after build

version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Optional: Run Vite dev server for local development
  # Uncomment and use: docker-compose run --service-ports dev
